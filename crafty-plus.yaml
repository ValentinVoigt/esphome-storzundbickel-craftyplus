  # These diagnostic interpretations are taken directly from the source app's
  # device-analysis logic.
  - platform: template
    device_id: crafty_device
    name: "Service Required"
    id: crafty_service_required
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      if (!id(sensor_ble_crafty_status_register_1).has_state() ||
          !id(sensor_ble_crafty_battery_status_1).has_state() ||
          !id(sensor_ble_crafty_system_status).has_state()) {
        return {};
      }
      uint16_t project = static_cast<uint16_t>(id(sensor_ble_crafty_status_register_1).state);
      uint16_t battery = static_cast<uint16_t>(id(sensor_ble_crafty_battery_status_1).state);
      uint16_t system = static_cast<uint16_t>(id(sensor_ble_crafty_system_status).state);
      return ((battery & 1536U) != 0) ||
             ((system & 512U) != 0) ||
             ((project & 8200U) != 0);

  - platform: template
    device_id: crafty_device
    name: "Cooling Required"
